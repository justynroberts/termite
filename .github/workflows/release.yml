name: Build & Release (Windows)

# Windows only, on purpose.
#
# macOS releases are cut locally with `npm run package:mac:signed`, because
# signing needs a Developer ID certificate and a stored notarytool profile and a
# GitHub runner has neither. A macOS job here would build unsigned artifacts and,
# on a tag, publish them straight over the signed ones — which is exactly what
# used to happen, and why every 0.9.x tag run had to be cancelled by hand, and
# why Windows went four releases without a build.
#
# So this workflow builds and publishes Windows, and nothing else. A tag push
# adds the installers and latest.yml to the release the macOS build already
# created, without touching it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach Windows artifacts to'
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch with a tag backfills a release that was cut for
          # macOS first; without it this builds whatever the default branch has.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `--publish always` uploads the installers and, importantly, latest.yml —
      # the feed electron-updater reads on Windows. Without it the updater finds
      # the newest release, finds no manifest, and fails silently.
      - name: Package and publish
        # releaseType is forced on the command line as well as in package.json:
        # backfilling an older tag checks out that tag's manifest, which predates
        # the setting, and without it electron-builder silently drops every file.
        # bash, not the runner's default PowerShell: it splits
        # `-c.publish.releaseType=release` and reads the tail as a config file path.
        shell: bash
        run: npx electron-builder --win -c.publish.releaseType=release --publish ${{ (startsWith(github.ref, 'refs/tags/') || inputs.tag) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termite-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn
